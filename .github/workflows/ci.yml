name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

  # Type checking with `ty` (Astral) is skipped until existing diagnostics
  # are fixed (`uv run ty check .`). Main causes:
  # - `list[T]` annotations inside resource classes resolve to the class's
  #   own `list` method, not the built-in. Intentional in ty (matches Python
  #   name resolution; mypy flags it too): https://github.com/astral-sh/ty/issues/1747
  #   Use `builtins.list`.
  # - HTTP client methods return `dict[str, Any] | list[Any]`, which is then
  #   unpacked with `**` into models.

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build
